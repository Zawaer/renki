name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # test/git-merge.test.ts exercises the real `git` binary (no mocking) —
      # attemptMerge's own commits (as opposed to the test's setup commands,
      # which already set GIT_AUTHOR_*/GIT_COMMITTER_* per call) need an
      # ambient identity, which a real developer machine always has but this
      # ephemeral runner doesn't.
      - run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # Reads the pnpm version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first so packages that consume @crc/protocol and @crc/client-core
      # (which resolve to ./dist) have their types/output available downstream.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
