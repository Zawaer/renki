name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first so packages that consume @crc/protocol and @crc/client-core
      # (which resolve to ./dist) have their types/output available downstream.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
