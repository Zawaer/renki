name: Publish Docker images

# Builds the two images docker-compose.yml already knows how to run
# (daemon from ./Dockerfile's `runtime` target, web from ./Dockerfile.web) and
# publishes them to GHCR — so `docker compose up` can pull a prebuilt image
# instead of everyone doing their own local `docker build` on first clone.
# Uses GITHUB_TOKEN (no extra registry secret to configure) since GHCR grants
# push access to the repo that owns the token.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: renki
            dockerfile: Dockerfile
            target: runtime
          - image: renki-web
            dockerfile: Dockerfile.web
            target: runtime
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main branch -> `latest` + `main-<short-sha>`; a `v1.2.3` tag ->
      # `1.2.3` + `1.2` + `1`. No `latest` on tag pushes, so a pre-release tag
      # can't accidentally become what a fresh `docker compose pull` grabs.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
