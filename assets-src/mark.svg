<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    Renki's mark: a coil — one and a half turns of a spiral, radii 18 / 28 / 38,
    even spacing, round terminations.

    From the "Renki Logo Concepts" design canvas, round 4, concept 4A: work
    continuing without you, drawn as a line that keeps going round. One stroked
    path and nothing else, so it holds at 16px as well as 1024px.

    Deliberately NOT symmetric — it's a spiral. Its ink sits from x22 to x88, so
    anything placing it in a tile has to centre the ink, not the viewBox (see
    assets-src/build-assets.py).
  -->
  <path d="M50,32 A18,18 0 0 1 50,68 A28,28 0 0 1 50,12 A38,38 0 0 1 50,88"
        fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" />
</svg>
