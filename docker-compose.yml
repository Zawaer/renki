services:
  daemon:
    build: .
    container_name: crc-daemon
    restart: unless-stopped
    # CRC_AUTH_TOKEN is optional here — if it's not in .env, the daemon mints
    # one on first boot and persists it at ./data/auth-token (on the host,
    # since that's bind-mounted below). Retrieve it any time with:
    #   docker compose exec daemon node dist/cli.js token
    env_file:
      - .env
    environment:
      # Fixed to match the volumes below — point CRC_REPOS_ROOT in .env at the
      # HOST path instead of changing these two.
      CRC_REPOS_ROOT: /repos
      CRC_DATA_DIR: /data
      # Container-internal only: Docker's port publishing can't reach a
      # process bound to the container's own loopback. The published port
      # below is still restricted to the HOST's loopback, so this doesn't
      # widen exposure — see the `ports:` comment.
      CRC_HOST: 0.0.0.0
    ports:
      # Bound to the host's loopback only, same as the bare-metal setup in
      # SETUP.md — front this with `tailscale serve --bg 4517` on the host.
      - "127.0.0.1:4517:4517"
    volumes:
      - ${CRC_REPOS_ROOT}:/repos
      - ./data:/data
      # Reuses the host's existing `claude login` session instead of logging
      # in again inside the container. Not read-only: the SDK also writes
      # its own per-session transcripts here (resume-per-prompt reads them
      # back). Linux hosts only — the `claude` CLI stores its session in a
      # plain file there. On macOS it's in the system Keychain, which isn't
      # a mountable file; run `claude login` inside the container instead
      # (`docker compose exec daemon claude login`) if your host is a Mac.
      - ${HOME}/.claude:/root/.claude
    # If you front this with a Caddy/Traefik/nginx CONTAINER instead of
    # tailscale serve (see SETUP.md § Advanced networking), that reverse
    # proxy's `127.0.0.1` means ITSELF, not this container — it has no route
    # to the port published above unless they share a Docker network.
    # Uncomment both blocks below, set the SAME network name your reverse
    # proxy is already on, and point its site config at `crc-daemon:4517`
    # (this container's name) instead of `127.0.0.1:4517`.
    # networks:
    #   - reverse-proxy

  # Optional: the actual web UI, statically built and served by nginx — the
  # Docker equivalent of the crc-web pm2 process. Not required; the daemon on
  # its own is enough if you'd rather just run `pnpm --filter @crc/web dev`
  # locally on whichever device you're using at the moment. Reuses whatever
  # Daemon URL + token you enter in its own Setup screen, so it doesn't need
  # to know about the daemon container at build or run time.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: crc-web
    restart: unless-stopped
    ports:
      # Same port and loopback-only binding as the bare-metal crc-web pm2
      # process — front it the same way (tailscale serve, or your own
      # reverse-proxy container on the same network as above).
      - "127.0.0.1:4173:80"
    # networks:
    #   - reverse-proxy

# networks:
#   reverse-proxy:
#     external: true
